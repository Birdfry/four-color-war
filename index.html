'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1778,H=1000,B={x:62,y:105,s:820},N=32,T=B.s/N;

let audio;const bg=document.createElement('canvas');bg.width=820;bg.height=820;const gc=bg.getContext('2d');
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

function sound(f=440,d=.08,type='sine'){if(muted)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.5,audio.currentTime+d);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function burst(x,y,c,n=12,big=1){for(let i=0;i<n;i++){let a=rng()*6.28,v=(25+rng()*85)*big;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+rng()*.5,max:1,c,r:2+rng()*3})}}

function spawn(f,boss=false){if(!teams[f].alive)return;let t=boss?3:pick([0,0,0,1,1,2]);let [x,y]=HOME[f],a=rng()*6.28;

function reset(s){seed=s??(Date.now()^Math.random()*1e9);state=seed>>>0;units=[];arrows=[];particles=[];floats=[];powers=[];feed=[];tiles=new Int8Array(N*N).fill(-1);teams=C.map((c,f)=>({f,hp:1550,max:1550,alive:true,spawn:0,land:0,count:0,kills:0,bosses:0,peak:0,comeback:false}));time=0;powerClock=5;mode='intro';intro=4;winner=-1;winClock=0;banner=null;shake=0;paused=false;document.getElementById('pause').textContent='Ⅱ 暂停';for(let f=0;f<4;f++){paint(...HOME[f],f,4);for(let i=0;i<10;i++)spawn(f)}buildGround();census();}
function buildGround(){gc.fillStyle='#d3d8bc';gc.fillRect(0,0,820,820);for(let y=0;y<N;y++)for(let x=0;x<N;x++){gc.fillStyle=(x+y)%2?'#c6d0b5':'#cdd5bc';gc.fillRect(x*T,y*T,T-1,T-1)}gc.strokeStyle='#e8e2c3';gc.lineWidth=46;gc.beginPath();gc.moveTo(75,75);gc.lineTo(745,745);gc.moveTo(745,75);gc.lineTo(75,745);gc.stroke();gc.strokeStyle='#c8c5a9';gc.lineWidth=1;for(let i=0;i<4;i++){gc.beginPath();gc.arc(410,410,83+i*4,0,6.28);gc.stroke()}for(let i=0;i<150;i++){let x=rng()*820,y=rng()*820;if(Math.abs(x-y)<32||Math.abs(x+y-820)<32)continue;gc.fillStyle=i%3?'#aeba99':'#edf0d0';gc.fillRect(x,y,2,4)} }

function damage(u,d,f){if(u.hp<=0)return;u.hp-=d*(u.shield>0?.32:1);u.hit=.15;u.swing=.1;if(u.hp<=0){teams[f].kills++;burst(u.x,u.y,C[u.f],u.t===3?35:8,u.t===3?2:1);if(rng()<.18)floating('+1',u.x,u.y,C[f],14);if(u.t===3){shake=9;announce(NAME[u.f]+'方巨人倒下！',C[u.f])}}}

function update(dt){if(paused)return;if(mode==='intro'){intro-=dt;if(intro<=0){mode='battle';announce('四王之争 · 开战！','#f5ce64','占领地盘 → 集结军队 → 攻破城堡')}return}if(mode==='win'){winClock+=dt;effects(dt);if(auto&&winClock>10)reset();return}

for(let u of units){if(u.hp<=0||!teams[u.f].alive)continue;u.cd-=dt;u.hit-=dt;u.swing-=dt;u.boost-=dt;u.shield-=dt;u.phase+=dt*(u.boost>0?14:9);let enemy=null,ed=Infinity,bx=u.x/100|0,by=u.y/100|0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)for(let v of buckets.get((bx+xx)+','+(by+yy))||[]){if(v.f===u.f||v.hp<=0)continue;let d=dist(u,v);if(d<ed){enemy=v;ed=d}}

let dx=goal.x-u.x,dy=goal.y-u.y,d=Math.hypot(dx,dy)||1;
let attack=target&&ed<range;let hitBase=!target&&bd<(u.t===1?125:62);
if((attack||hitBase)&&u.cd<=0){u.cd=u.t===3?1.1:u.t===1?.95:.65;u.swing=.25;if(attack){if(u.t===1)arrows.push({x:u.x,y:u.y,target,damage:u.damage,f:u.f,life:1.8});else{damage(target,u.damage,u.f);target.x=clamp(target.x+dx/d*3,18,802);target.y=clamp(target.y+dy/d*3,18,802);if(u.t===3){burst(target.x,target.y,'#fff1b9',8);for(let v of units)if(v!==target&&v.f!==u.f&&dist(v,target)<34)damage(v,15,u.f)}}}else{baseDamage(base.f,u.damage*(u.t===3?2.8:1.5),u.f);burst(basePoint.x+(rng()-.5)*50,basePoint.y,'#fce1b2',3);if(rng()<.1)floating('−'+Math.round(u.damage*1.5),basePoint.x,basePoint.y-40,'#fff',15)}if(noiseClock<=0){sound(180+rng()*150,.035,'triangle');noiseClock=.15}}
if(!attack&&!hitBase){let v=u.v*(u.boost>0?1.7:1)*(time>85?1.2:1);u.x=clamp(u.x+dx/d*v*dt,14,806);u.y=clamp(u.y+dy/d*v*dt,14,806);if(Math.abs(dx)>.5)u.face=dx>0?1:-1}

}
for(let a of arrows){a.life-=dt;if(a.target.hp<=0){a.life=0;continue}let dx=a.target.x-a.x,dy=a.target.y-a.y,d=Math.hypot(dx,dy);a.angle=Math.atan2(dy,dx);if(d<12){damage(a.target,a.damage,a.f);burst(a.x,a.y,C[a.f],3);a.life=0}else{a.x+=dx/d*320*dt;a.y+=dy/d*320*dt}}arrows=arrows.filter(a=>a.life>0);units=units.filter(u=>u.hp>0);effects(dt);

units=units.filter(u=>u.hp>0&&teams[u.f].alive);census();alive=teams.filter(t=>t.alive);if(alive.length<=1){winner=alive.length?alive[0].f:teams.reduce((a,b)=>a.land>b.land?a:b).f;mode='win';winClock=0;announce(NAME[winner]+'方夺冠！',C[winner],'这一次，你押对了吗？');sound(880,.6,'triangle');for(let i=0;i<8;i++)burst(rng()*820,rng()*820,C[winner],20,2)}
}
function effects(dt){shake=Math.max(0,shake-dt*25);for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=95*dt;p.vx*=1-dt*2}particles=particles.filter(p=>p.life>0);for(let f of floats){f.life-=dt;f.y-=dt*22}floats=floats.filter(f=>f.life>0);if(banner)banner.life-=dt;}
function castle(f){let t=teams[f],[x,y]=HOME[f];ctx.save();ctx.translate(x,y);ctx.globalAlpha=t.alive?1:.48;ctx.fillStyle='#29384344';ctx.beginPath();ctx.ellipse(0,25,51,18,0,0,6.28);ctx.fill();if(!t.alive){rr(ctx,-35,-2,70,30,5,'#6c7774');for(let i=0;i<5;i++)rr(ctx,-40+i*17,-12+(i%2)*7,12,22,2,'#87928b');ctx.restore();return}
rr(ctx,-36,-16,72,47,4,'#6b8089','#354752');rr(ctx,-31,-12,62,37,3,'#b8c9c5');rr(ctx,-37,-19,74,10,2,D[f]);for(let i=-1;i<=1;i+=2){rr(ctx,i*34-13,-34,26,65,4,'#91a9ae','#40545f');rr(ctx,i*34-11,-31,22,8,2,'#d4dfd2');for(let j=0;j<3;j++)rr(ctx,i*34-13+j*10,-42,6,14,1,C[f]);rr(ctx,i*34-4,-18,8,17,3,'#334b5b')}
rr(ctx,-12,4,24,27,[12,12,0,0],'#334957');rr(ctx,-8,10,16,21,[8,8,0,0],'#263644');line(0,-16,0,-72,'#4c6169',4);ctx.beginPath();ctx.moveTo(2,-72);ctx.lineTo(37,-66+Math.sin(time*4+f)*3);ctx.lineTo(2,-48);ctx.closePath();ctx.fillStyle=C[f];ctx.fill();text(['焰','潮','森','光'][f],18,-57,13,'#263645','center',900);
rr(ctx,-43,39,86,8,4,'#344b55');rr(ctx,-42,40,84*Math.max(0,t.hp/t.max),6,3,C[f]);if(t.hp/t.max<.35){circle(ctx,-30,-20,5+Math.sin(time*12)*2,'#ffaf55');circle(ctx,32,-34,7,'#f7d878')}
ctx.restore();}

if(u.t===1){ctx.beginPath();ctx.moveTo(-10,-17);ctx.lineTo(2,-34);ctx.lineTo(13,-17);ctx.fillStyle=C[u.f];ctx.fill();line(4,-27,13,-31,'#fff0d2',2)}else if(u.t===2){rr(ctx,-10,-25,20,11,4,'#bac7d1','#344c58');rr(ctx,-9,-17,18,4,2,D[u.f])}else if(u.t===3){ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.moveTo(-10,-23);ctx.lineTo(-12,-32);ctx.lineTo(-5,-28);ctx.lineTo(0,-36);ctx.lineTo(5,-28);ctx.lineTo(12,-32);ctx.lineTo(10,-23);ctx.fill();rr(ctx,-10,-24,20,4,1,'#c99136')}else{rr(ctx,-10,-23,20,6,3,C[u.f]);ctx.beginPath();ctx.moveTo(-2,-23);ctx.lineTo(0,-33);ctx.lineTo(6,-25);ctx.fillStyle=C[u.f];ctx.fill()}
