function formAlliance(a,b){if(!canFormAlliance(a,b))return false;let affected=new Set([...coalitionMembers(a),...coalitionMembers(b)]);let x=Math.min(a,b),y=Math.max(a,b),pact={a:x,b:y,formedAt:time,until:time+52+rng()*24};diplomacy.alliances.push(pact);rebuildAllianceMask();clearDiplomacyOrders(...affected);logEvent({kind:'alliance',a:x,b:y,until:pact.until});announce(NAME[x]+'方与'+NAME[y]+'方结盟！','#f1d28b','多国联盟 · 同盟最多三方');return true}
